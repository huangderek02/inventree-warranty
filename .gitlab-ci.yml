stages:
  - lint
  - build

style:
  stage: lint
  image: python:3.9
  before_script:
    - pip install flake8 pep8-naming
  script:
    - flake8 .

build:
  stage: build
  image: python:3.9
  before_script:
    - pip install --upgrade wheel setuptools twine build
  script:
    - python -m build

frontend:
  stage: build
  image: node:20
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run build
    - npm run translate
    - npm run lint