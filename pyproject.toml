[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warranty"
version = "0.2.0"                # bump this when you tag (e.g. 0.1.1)
description = "Warranty plugin for InvenTree"
readme = { text = "Warranty plugin for InvenTree.", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "BSD-2-Clause" }
authors = [{ name = "John Doe" }]
keywords = ["inventree", "plugin"]
dependencies = ["requests", "python-dateutil"]

[project.entry-points."inventree_plugins"]
warranty = "warranty.core:Warranty"

[tool.setuptools.packages.find]
include = ["warranty*"]          # <— ensure the package is discovered

# If you have static/assets/templates (keep or delete if not needed)
[tool.setuptools.package-data]
"warranty" = ["**/*.js", "**/*.css", "**/*.json", "**/*.html", "**/*.txt", "static/**/*", "templates/**/*"]
